services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insighthub
      POSTGRES_USER: insighthub
      POSTGRES_PASSWORD: insighthub
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insighthub -d insighthub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - insighthub-postgres:/var/lib/postgresql/data

volumes:
  insighthub-postgres:
