services:
  - type: web
    name: insighthub-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm db:generate && pnpm --filter @insighthub/api build
    startCommand: pnpm db:deploy && pnpm --filter @insighthub/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: API_CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: INGESTION_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: INGESTION_RATE_LIMIT_MAX
        value: "120"
      - key: INGESTION_RATE_LIMIT_MAX_BUCKETS
        value: "5000"
